<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" role="img" aria-label="HAUNT SYSTEMS — autonomous systems for complex physical environments">
  <rect width="1280" height="360" fill="#070809"/>
  <rect x="0.5" y="0.5" width="1279" height="359" fill="none" stroke="#2A2D31"/>

  <!-- top-left: status LED + label -->
  <rect x="80" y="48" width="6" height="6" fill="#FF5C1A"/>
  <text x="98" y="56" font-family="ui-monospace,'SFMono-Regular','IBM Plex Mono',Menlo,Consolas,monospace" font-size="11" letter-spacing="2.4" fill="#8C9198">SYSTEM ACTIVE</text>

  <!-- top-right: domain -->
  <text x="1200" y="56" text-anchor="end" font-family="ui-monospace,'SFMono-Regular','IBM Plex Mono',Menlo,Consolas,monospace" font-size="11" letter-spacing="2.4" fill="#8C9198">HAUNT.SYSTEMS</text>

  <!-- machined wordmark: HAUNT (grid: letter 16x18, stroke 4, advance 22) scaled x6 at (80,126) -->
  <g transform="translate(80,126) scale(6)" fill="#F0F0EC">
    <!-- H -->
    <rect x="0" y="0" width="4" height="18"/>
    <rect x="12" y="0" width="4" height="18"/>
    <rect x="4" y="7" width="8" height="4"/>
    <!-- A -->
    <rect x="22" y="0" width="16" height="4"/>
    <rect x="22" y="4" width="4" height="14"/>
    <rect x="34" y="4" width="4" height="14"/>
    <rect x="26" y="10" width="8" height="4"/>
    <!-- U -->
    <rect x="44" y="0" width="4" height="18"/>
    <rect x="56" y="0" width="4" height="18"/>
    <rect x="48" y="14" width="8" height="4"/>
    <!-- N -->
    <rect x="66" y="0" width="4" height="18"/>
    <rect x="78" y="0" width="4" height="18"/>
    <polygon points="70,0 74,0 78,18 74,18"/>
    <!-- T -->
    <rect x="88" y="0" width="16" height="4"/>
    <rect x="94" y="4" width="4" height="14"/>
    <!-- reactor indicator -->
    <rect x="110" y="14" width="4" height="4" fill="#FF5C1A"/>
  </g>

  <!-- tagline -->
  <text x="80" y="282" font-family="ui-monospace,'SFMono-Regular','IBM Plex Mono',Menlo,Consolas,monospace" font-size="13" letter-spacing="2.9" fill="#8C9198">AUTONOMOUS SYSTEMS FOR COMPLEX PHYSICAL ENVIRONMENTS</text>
</svg>
